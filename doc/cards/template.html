<h1>各部位卡片總覽</h1>
<p>按插卡部位查找，每張卡一次比較各版本 GS 與能力。選擇職業與排序版本，卡片會依 GS 由高至低排列。</p>
<p><a href="../equipment/index.html">裝備總覽 ↗</a> · <a href="../jobs/index.html">職業天賦與技能</a></p>
